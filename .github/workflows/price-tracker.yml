name: Daily component prices

on:
  schedule:
    # 07:23 summer / 06:23 winter in Bulgaria; GitHub schedules use UTC.
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/price-tracker/**'
      - '.github/workflows/price-tracker.yml'
  pull_request:
    paths:
      - 'apps/price-tracker/**'
      - '.github/workflows/price-tracker.yml'

concurrency:
  group: component-prices-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: apps/price-tracker
      - run: python -m unittest discover -s tests -v
        working-directory: apps/price-tracker

  collect:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: apps/price-tracker
      - name: Restore persistent history
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/price-data; then
            git show origin/price-data:prices.sqlite > apps/price-tracker/prices.sqlite
          fi
      - name: Collect observations
        id: scrape
        continue-on-error: true
        run: python -m tracker --max-pages 2
        working-directory: apps/price-tracker
      - name: Save run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-prices-${{ github.run_id }}
          path: |
            apps/price-tracker/output/
            apps/price-tracker/prices.sqlite
          retention-days: 14
          if-no-files-found: error
      - name: Publish data branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/price-tracker/output/status.json
          mkdir -p "$RUNNER_TEMP/price-export"
          cp apps/price-tracker/output/* "$RUNNER_TEMP/price-export/"
          cp apps/price-tracker/prices.sqlite "$RUNNER_TEMP/price-export/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/price-data; then
            git switch --force-create price-data origin/price-data
          else
            git switch --orphan price-data
          fi
          git rm -rf --ignore-unmatch .
          cp "$RUNNER_TEMP/price-export/"* .
          git add README.md '*.csv' '*.json' prices.sqlite
          git commit -m 'Update component market observations'
          git push origin HEAD:price-data
      - name: Mark complete collection failure
        if: steps.scrape.outcome == 'failure'
        run: exit 1
