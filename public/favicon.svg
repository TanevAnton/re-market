<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    The RIGO mark as a tab icon.

    A FILLED TILE, unlike the header version, and that is deliberate rather
    than inconsistent. A bare two-arc ring at 16px on a browser tab is a few
    pale pixels against whatever colour the tab strip happens to be — it
    disappears on a light theme and again on a dark one. A solid accent tile
    with the mark knocked out of it holds its shape on both.

    The gaps are the first thing to close at this size, so they are cut wider
    here than in the header drawing: at 16px the ring should still read as an O
    even once they have all but vanished.

    Colours are literal, not currentColor: nothing in a favicon inherits.
    #047857 is the light-theme accent — the darker of the two — because a tab
    strip is usually light and the lighter #34d399 washes out on white.
  -->
  <rect width="32" height="32" rx="7" fill="#047857"/>

  <g fill="none" stroke="#F0FDF9" stroke-width="3.4" stroke-linecap="round">
    <path d="M21.74 24.19 A10 10 0 0 1 7.81 10.26"/>
    <path d="M10.26 7.81 A10 10 0 0 1 24.19 21.74"/>
  </g>
</svg>
