<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The RIGO mark as a tab icon.

    A FILLED TILE, unlike the header version, and that is deliberate rather
    than inconsistent. A bare two-arc ring at 16px on a browser tab is a few
    pale pixels against whatever colour the tab strip happens to be - it
    disappears on a light theme and again on a dark one. A solid tile with the
    mark on it holds its shape on both.

    DARK TILE, TWO COLOURS. The mark is one green half and one white half
    since November, the same split as the RE-Tech mark. Two colours need a
    ground both of them show up on, and the green tile this used to be only
    carried white - so the tile is now the site's own dark background, with
    the mark exactly as it appears in the header of the dark theme.

    The gaps are the first thing to close at this size, so they are cut wider
    here than in the header drawing: at 16px the ring should still read as an O
    even once they have all but vanished.

    Colours are literal, not currentColor: nothing in a favicon inherits.
    #34d399 is the dark-theme accent, the one that belongs on a dark ground.

    public/email-logo.png is this file rendered at 128px. Change one, render
    the other.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0d0c"/>

  <g fill="none" stroke-width="3.4" stroke-linecap="round">
    <path d="M18.76 25.61 A10 10 0 0 1 6.39 13.24" stroke="#34d399"/>
    <path d="M13.24 6.39 A10 10 0 0 1 25.61 18.76" stroke="#f4f7f6"/>
  </g>
</svg>
