# RE-MARKET - nginx site for a LAN server.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/remarket
#   sudo ln -sf /etc/nginx/sites-available/remarket /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # LAN only, reached by IP. `_` matches any Host header, so it answers on
    # the address, the hostname, and anything else pointed at this box.
    server_name _;

    root /var/www/remarket/public;
    index index.php;

    charset utf-8;

    # THE ONE THAT BITES ON FIRST DEPLOY.
    # nginx defaults to 1M. A phone photo is 3-8M, so uploads fail with a bare
    # 413 before PHP is even reached - and nothing appears in the Laravel log,
    # because Laravel never ran. Keep this at or above post_max_size in php.ini
    # (24M there, see deploy/php-remarket.ini).
    client_max_body_size 24M;

    # Uploads are the slow request on this site; the default 60s read timeout
    # is enough for a photo but not for a batch of twelve on a phone uplink.
    client_body_timeout 120s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Built assets are content-hashed by Vite, so they can be cached forever.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Listing photos, served through the storage symlink.
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ \.php$ {
        # Match the PHP version actually installed. `ls /run/php/` shows it.
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
    }

    # Nothing outside public/ is reachable, but be explicit about the files
    # people probe for.
    location ~ /\.(?!well-known).* { deny all; }

    error_log  /var/log/nginx/remarket-error.log;
    access_log /var/log/nginx/remarket-access.log;
}
