; RE-MARKET PHP settings.
;
;   sudo cp deploy/php-remarket.ini /etc/php/8.4/fpm/conf.d/99-remarket.ini
;   sudo systemctl restart php8.4-fpm
;
; Photo uploads are the only demanding thing this app does, and every value
; here exists because leaving it at the default breaks them in a way the logs
; do not explain.

; Twelve photos per listing, phone-sized.
upload_max_filesize = 16M

; Must exceed upload_max_filesize: the POST carries the files plus the form.
; nginx's client_max_body_size must be at least this too, or the request never
; reaches PHP at all.
post_max_size = 24M
max_file_uploads = 20

; GD decompresses a JPEG to roughly width x height x 4 bytes. A 12-megapixel
; photo is ~48MB in memory regardless of the 4MB file on disk, and resizing
; needs source and destination live at once.
memory_limit = 512M

; Resizing a batch takes longer than the 30s default.
max_execution_time = 120
max_input_time = 120

; On Windows this being empty silently broke every upload - PHP could not
; create the temp file and reported nothing useful. Set it explicitly here so
; the same failure cannot happen quietly on Linux.
upload_tmp_dir = /tmp

; A production server should never render a stack trace to a visitor, but
; APP_DEBUG governs that. This one keeps PHP's own warnings out of the HTML.
display_errors = Off
log_errors = On

; Sofia. Laravel sets its own timezone from config, but PHP's own date
; functions and log timestamps use this.
date.timezone = Europe/Sofia
