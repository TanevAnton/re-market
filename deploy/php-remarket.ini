; RE-MARKET PHP settings.
;
;   sudo cp deploy/php-remarket.ini /etc/php/8.4/fpm/conf.d/99-remarket.ini
;   sudo systemctl restart php8.4-fpm
;
; Photo uploads are the only demanding thing this app does, and every value
; here exists because leaving it at the default breaks them in a way the logs
; do not explain.

; Per file. Lowered from 16M to 10M and that is not a downgrade: a phone photo
; is 3-8M, 10M covers every one of them, and the validation rule in the wizard
; now matches this number instead of sitting above it.
upload_max_filesize = 10M

; MUST EXCEED upload_max_filesize x HOWEVER MANY FILES GO IN ONE REQUEST, and
; that is the bit this file had wrong.
;
; Livewire sends every file from a `multiple` input in ONE POST. So the old
; pairing - 16M per file against a 24M POST - meant a seller selecting two phone
; photos at once was already at the ceiling and three was over it. The request
; then dies at nginx with a bare 413: Laravel never runs, nothing reaches the
; log, and Livewire shows the user no error at all. That is the single most
; likely way the first twenty listings fail to get posted.
;
; 64M holds six 10M photos in one go. It is not enough for twelve, and it cannot
; be: 12 x 10M is 120M of POST body. The real fix is downscaling in the browser
; before the upload, which is a separate change that needs testing on a real
; phone - until then the wizard counts the bytes and refuses a selection that
; would not fit, in Bulgarian, instead of letting nginx answer 413.
post_max_size = 64M
max_file_uploads = 20

; GD decompresses a JPEG to roughly width x height x 4 bytes. A 12-megapixel
; photo is ~48MB in memory regardless of the 4MB file on disk, and resizing
; needs source and destination live at once.
memory_limit = 512M

; Resizing a batch takes longer than the 30s default.
max_execution_time = 120
max_input_time = 120

; On Windows this being empty silently broke every upload - PHP could not
; create the temp file and reported nothing useful. Set it explicitly here so
; the same failure cannot happen quietly on Linux.
upload_tmp_dir = /tmp

; A production server should never render a stack trace to a visitor, but
; APP_DEBUG governs that. This one keeps PHP's own warnings out of the HTML.
display_errors = Off
log_errors = On

; Sofia. Laravel sets its own timezone from config, but PHP's own date
; functions and log timestamps use this.
date.timezone = Europe/Sofia
